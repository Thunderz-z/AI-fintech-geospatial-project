[project]
name = "relia"
version = "0.1.0"
description = "Shared AI reliability infrastructure: provider abstraction, tracing, evaluation, replay, regression analysis and evidence contracts."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[project.scripts]
relia = "relia.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relia"]
