[project]
name = "terrascope"
version = "0.1.0"
description = "Geospatial environmental intelligence for the Pallikaranai Marsh, Chennai: satellite ingestion, land-cover analytics and evidence-grounded reporting."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "geopandas>=1.0.1",
    "matplotlib>=3.9",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "planetary-computer>=1.0.0",
    "pyproj>=3.7.0",
    "pystac-client>=0.8.3",
    "rasterio>=1.4.3",
    "relia",
    "rioxarray>=0.17.0",
    "scikit-learn>=1.5",
    "shapely>=2.0.6",
    "uvicorn>=0.32",
]

[tool.uv.sources]
relia = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrascope"]
