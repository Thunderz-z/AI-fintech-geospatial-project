    expected_size: "HI-Small_Trans.csv 475.66 MB + HI-Small_Patterns.txt 323.84 kB (verified from Kaggle file listing 2026-10-31); ~5M transactions / ~5.1K laundering per data card (to verify at download)"
    access_method: "Kaggle (manual download by account owner after terms acceptance); 475.66 MB is below the 500 MB gate"
