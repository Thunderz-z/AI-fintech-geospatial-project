name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  docker:
    # The owner develops without Docker Desktop; CI verifies the images build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build terrascope image
        run: docker build -f infrastructure/docker/terrascope.Dockerfile -t terrascope:ci .
      - name: Build finguard image
        run: docker build -f infrastructure/docker/finguard.Dockerfile -t finguard:ci .
